const cache=new Map();
function getConj(i){
  if(cache.has(i)) return cache.get(i);
  const v=VERBS[i];
  const past=v[4].map(a=>({ar:a}));
  const pres=v[5].map(a=>({ar:a}));
  const kindMap={reg:'regular',hollow:'hollow',def:'defective',doubled:'doubled',irr:'irregular'};
  const c={past,pres,kind:kindMap[v[2]]||v[2],gloss:v[3]};
  cache.set(i,c);
  return c;
}

function fold(s){return s.toLowerCase().replace(/[āīūḥṭṣḍẓʿʾ]/g,c=>({ā:'a',ī:'i',ū:'u',ḥ:'h',ṭ:'t',ṣ:'s',ḍ:'d',ẓ:'z',ʿ:'',ʾ:''})[c]);}

const INDEX=VERBS.map((v,i)=>({i,ar:v[0]+' '+v[1],tr:fold(v[0]+' '+v[1]),gl:v[3].toLowerCase()}));

let cur=0, tense=0, visible=INDEX.map(x=>x.i);
const $=id=>document.getElementById(id);

function renderList(){
  const L=$('list'); L.innerHTML='';
  const frag=document.createDocumentFragment();
  for(const idx of visible){
    const c=getConj(idx);
    const b=document.createElement('button');
    b.className='vrow'; b.setAttribute('role','option');
    b.setAttribute('aria-current',idx===cur?'true':'false');
    b.innerHTML='<span class="ar">'+c.past[3].ar+'</span><span class="tr">'+VERBS[idx][1]+'</span><span class="gl">'+VERBS[idx][3]+'</span>';
    b.onclick=()=>{cur=idx;renderDetail();renderList();};
    frag.appendChild(b);
  }
  L.appendChild(frag);
  $('count').textContent=visible.length+' of '+VERBS.length+' verbs';
}

function renderDetail(){
  const v=VERBS[cur], c=getConj(cur);
  $('bigar').innerHTML=c.past[3].ar+'<span class="pres">'+c.pres[3].ar+'</span>';
  $('meta').innerHTML='<b>'+v[1]+'</b> — '+v[3];
  $('kind').textContent=c.kind;
  document.querySelectorAll('#tabs button').forEach((b,j)=>b.setAttribute('aria-pressed',j===tense?'true':'false'));
  let rows='<tr><th>Pronoun</th><th>Arabic</th></tr>';
  for(let r=0;r<8;r++){
    let ar;
    if(tense===0){ar=c.past[r].ar;}
    else if(tense===1){ar=c.pres[r].ar;}
    else{ar='رح '+c.pres[r].ar;}
    rows+='<tr><td class="pn">'+PRONOUNS[r]+'</td><td class="aw ar">'+ar+'</td></tr>';
  }
  $('tbl').innerHTML=rows;
}

["Past","Present","Future = raḥ + present"].forEach((t,j)=>{
  const b=document.createElement('button'); b.textContent=t;
  b.onclick=()=>{tense=j;renderDetail();};
  $('tabs').appendChild(b);
});

const rnd=document.createElement('button');
rnd.textContent='🎲 Random verb';
rnd.style.marginInlineStart='auto';
rnd.onclick=()=>{
  const pool=visible.length?visible:INDEX.map(x=>x.i);
  let pick=pool[Math.floor(Math.random()*pool.length)];
  if(pool.length>1) while(pick===cur) pick=pool[Math.floor(Math.random()*pool.length)];
  cur=pick; renderDetail(); renderList();
  const row=document.querySelector('.vrow[aria-current="true"]'), list=$('list');
  if(row){
    const r=row.getBoundingClientRect(), l=list.getBoundingClientRect();
    if(r.top<l.top) list.scrollTop-=(l.top-r.top);
    else if(r.bottom>l.bottom) list.scrollTop+=(r.bottom-l.bottom);
  }
};
$('tabs').appendChild(rnd);

$('q').addEventListener('input',e=>{
  const q=e.target.value.trim(), qf=fold(q);
  visible = q ? INDEX.filter(x=>x.gl.includes(qf)||x.tr.includes(qf)||x.ar.includes(q)).map(x=>x.i) : INDEX.map(x=>x.i);
  renderList();
});

renderList(); renderDetail();

const ea=$('ethaddr');
ea.addEventListener('click',async()=>{
  const addr='0x7598557A58F1F0972EE7b66214D546a3328065bE';
  try{await navigator.clipboard.writeText(addr);}
  catch(e){
    const r=document.createRange(); r.selectNodeContents(ea);
    const s=getSelection(); s.removeAllRanges(); s.addRange(r);
    document.execCommand('copy'); s.removeAllRanges();
  }
  ea.textContent='copied ✓';
  setTimeout(()=>{ea.textContent=addr;},1500);
});
</script>
