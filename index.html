const cache=new Map();
function getConj(i){if(cache.has(i))return cache.get(i);cache.set(i,VERBS[i]);return VERBS[i];}
function fold(s){return s.toLowerCase().replace(/ё/g,'е');}
const INDEX=VERBS.map((v,i)=>({i,ru:v.inf,tr:fold(v.inf),gl:v.t.toLowerCase()}));
let cur=0,tense=0,visible=INDEX.map(x=>x.i);
const $=id=>document.getElementById(id);

function renderList(){
  const L=$('list');L.innerHTML='';
  const frag=document.createDocumentFragment();
  for(const idx of visible){
    const c=getConj(idx);
    const b=document.createElement('button');
    b.className='vrow';b.setAttribute('role','option');
    b.setAttribute('aria-current',idx===cur?'true':'false');
    b.innerHTML='<span class="ru">'+c.inf+'</span><span class="tr">'+c.a+'</span><span class="gl">'+c.t+'</span>';
    b.onclick=()=>{cur=idx;renderDetail();renderList();};
    frag.appendChild(b);
  }
  L.appendChild(frag);
  $('count').textContent=visible.length+' of '+VERBS.length+' verbs';
}

function renderDetail(){
  const c=getConj(cur);
  $('bigru').textContent=c.inf;
  $('meta').innerHTML='<b>'+c.t+'</b> — '+(c.a==='perf'?'perfective':'imperfective');
  $('kind').textContent=c.a==='perf'?'perfective':'imperfective';
  document.querySelectorAll('#tabs button').forEach((b,j)=>b.setAttribute('aria-pressed',j===tense?'true':'false'));
  let rows='';
  if(tense===0){
    rows='<tr><th>Gender/Number</th><th>Past</th></tr>';
    for(let r=0;r<4;r++)rows+='<tr><td class="pn">'+PAST_L[r]+'</td><td class="ruw">'+c.past[r]+'</td></tr>';
  }else if(tense===1){
    rows='<tr><th>Person</th><th>Present</th></tr>';
    for(let r=0;r<6;r++)rows+='<tr><td class="pn">'+PRES_L[r]+'</td><td class="ruw">'+c.pres[r]+'</td></tr>';
  }else{
    rows='<tr><th>Person</th><th>Future</th></tr>';
    for(let r=0;r<6;r++)rows+='<tr><td class="pn">'+PRES_L[r]+'</td><td class="ruw">'+c.fut[r]+'</td></tr>';
  }
  $('tbl').innerHTML=rows;
}

["Past","Present","Future"].forEach((t,j)=>{
  const b=document.createElement('button');b.textContent=t;
  b.onclick=()=>{tense=j;renderDetail();};
  $('tabs').appendChild(b);
});

const rnd=document.createElement('button');
rnd.textContent='🎲 Random verb';
rnd.style.marginInlineStart='auto';
rnd.onclick=()=>{
  const pool=visible.length?visible:INDEX.map(x=>x.i);
  let pick=pool[Math.floor(Math.random()*pool.length)];
  if(pool.length>1)while(pick===cur)pick=pool[Math.floor(Math.random()*pool.length)];
  cur=pick;renderDetail();renderList();
  const row=document.querySelector('.vrow[aria-current="true"]'),list=$('list');
  if(row){const r=row.getBoundingClientRect(),l=list.getBoundingClientRect();if(r.top<l.top)list.scrollTop-=(l.top-r.top);else if(r.bottom>l.bottom)list.scrollTop+=(r.bottom-l.bottom);}
};
$('tabs').appendChild(rnd);

$('q').addEventListener('input',e=>{
  const q=e.target.value.trim(),qf=fold(q);
  visible=q?INDEX.filter(x=>x.gl.includes(qf)||x.tr.includes(qf)||x.ru.includes(q)).map(x=>x.i):INDEX.map(x=>x.i);
  renderList();
});

renderList();renderDetail();

const ea=$('ethaddr');
ea.addEventListener('click',async()=>{
  const addr='0x7598557A58F1F0972EE7b66214D546a3328065bE';
  try{await navigator.clipboard.writeText(addr);}
  catch(e){const r=document.createRange();r.selectNodeContents(ea);const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');s.removeAllRanges();}
  ea.textContent='copied ✓';
  setTimeout(()=>{ea.textContent=addr;},1500);
});
