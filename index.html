    b.appendChild(ru);b.appendChild(gl);
    b.onclick=()=>{cur=idx;side=null;nnum=0;renderDetail();renderList();};
    frag.appendChild(b);
  }
  L.appendChild(frag);
  $('count').textContent=visible.length+' of '+PAGES.length+' words';
}

function mkRnd(){
  const rnd=document.createElement('button');
  rnd.textContent='🎲 Random word';
  rnd.style.marginInlineStart='auto';
  rnd.onclick=()=>{
    const pool=visible.length?visible:INDEX.map(x=>x.i);
    let pick=pool[Math.floor(Math.random()*pool.length)];
    if(pool.length>1)while(pick===cur)pick=pool[Math.floor(Math.random()*pool.length)];
    cur=pick;side=null;nnum=0;renderDetail();renderList();
    const row=document.querySelector('.vrow[aria-current="true"]'),list=$('list');
    if(row){const r=row.getBoundingClientRect(),l=list.getBoundingClientRect();if(r.top<l.top)list.scrollTop-=(l.top-r.top);else if(r.bottom>l.bottom)list.scrollTop+=(r.bottom-l.bottom);}
  };
  return rnd;
}

function renderNoun(e){
  $('bigru').textContent=e.v;
  const glabel={m:'masculine',f:'feminine',n:'neuter'}[e.d];
  $('meta').innerHTML='<b>'+e.g+'</b> — noun · '+glabel+(e.pl?'':' · no plural');
  $('aspects').innerHTML='';
  if(!e.pl)nnum=0;
  const T=$('tabs');T.innerHTML='';
  const labels=['Singular','Plural'];
  const maxT=e.pl?1:0;
  for(let t=0;t<=maxT;t++){
    const b=document.createElement('button');b.textContent=labels[t];
    b.setAttribute('aria-pressed',t===nnum?'true':'false');
    b.onclick=()=>{nnum=t;renderDetail();};
    T.appendChild(b);
  }
  T.appendChild(mkRnd());
  const forms=nnum===0?e.sg:e.pl;
  let rows='<tr><th>Case</th><th>'+labels[nnum]+'</th></tr>';
  for(let r=0;r<6;r++)rows+='<tr><td class="pn">'+CASE_L[r]+'</td><td class="ruw">'+forms[r]+'</td></tr>';
  $('tbl').innerHTML=rows;
  $('example').textContent=e.x||'';
}

function renderAdj(e){
  $('bigru').textContent=e.v;
  $('meta').innerHTML='<b>'+e.g+'</b> — adjective';
  $('aspects').innerHTML='';
  const T=$('tabs');T.innerHTML='';
  T.appendChild(mkRnd());
  let rows='<tr><th>Form</th><th>Adjective</th></tr>';
  rows+='<tr><td class="pn">Masculine</td><td class="ruw">'+e.v+'</td></tr>';
  rows+='<tr><td class="pn">Feminine</td><td class="ruw">'+e.f+'</td></tr>';
  rows+='<tr><td class="pn">Neuter</td><td class="ruw">'+e.n+'</td></tr>';
  rows+='<tr><td class="pn">Plural</td><td class="ruw">'+e.pl+'</td></tr>';
  if(e.comp)rows+='<tr><td class="pn">Comparative</td><td class="ruw">'+e.comp+'</td></tr>';
  $('tbl').innerHTML=rows;
  $('example').textContent=e.x||'';
}

function renderDetail(){
  const e=PAGES[cur];
  if(e.t==='n'){renderNoun(e);return;}
  if(e.t==='a'){renderAdj(e);return;}
  if(!side||!e[side])side=e.i?'i':'p';
  const d=e[side];
  $('bigru').textContent=d.v;
  $('meta').innerHTML='<b>'+e.g+'</b> — '+(side==='i'?'imperfective':'perfective');
  const A=$('aspects');A.innerHTML='';
  for(const s of ['i','p']){
    if(!e[s])continue;
    const b=document.createElement('button');
    b.innerHTML=e[s].v+'<small>'+(s==='i'?'imperfective':'perfective')+'</small>';
    b.setAttribute('aria-pressed',s===side?'true':'false');
    b.onclick=()=>{side=s;if(s==='p'&&tense===1)tense=2;renderDetail();};
    A.appendChild(b);
  }
  const tvals=tenseVals(side),labels={0:'Past',1:'Present',2:'Future'};
  if(!tvals.includes(tense))tense=tvals[1];
  const T=$('tabs');T.innerHTML='';
  for(const t of tvals){
    const b=document.createElement('button');b.textContent=labels[t];
    b.setAttribute('aria-pressed',t===tense?'true':'false');
    b.onclick=()=>{tense=t;renderDetail();};
    T.appendChild(b);
  }
  T.appendChild(mkRnd());
  const f=getForms(e,side,tense);
  let rows;
  if(tense===0){
    rows='<tr><th>Gender/Number</th><th>Past</th></tr>';
    for(let r=0;r<4;r++)rows+='<tr><td class="pn">'+PAST_L[r]+'</td><td class="ruw">'+f[r]+'</td></tr>';
  }else{
    rows='<tr><th>Person</th><th>'+labels[tense]+'</th></tr>';
    for(let r=0;r<6;r++)rows+='<tr><td class="pn">'+PRES_L[r]+'</td><td class="ruw">'+f[r]+'</td></tr>';
  }
  $('tbl').innerHTML=rows;
  $('example').textContent=d.x||'';
}

$('q').addEventListener('input',e=>{
  const q=e.target.value.trim(),qf=fold(q);
  visible=q?INDEX.filter(x=>x.gl.includes(qf)||x.ri.includes(qf)||x.rp.includes(qf)).map(x=>x.i):INDEX.map(x=>x.i);
  if(visible.length===1){
    cur=visible[0];
    const m=INDEX[cur],e=PAGES[cur];
    side=(e.i&&qf&&fold(e.i.v)!==qf&&e.p&&fold(e.p.v)===qf)?'p':null;
    renderDetail();
  }
  renderList();
  if(visible.length===1){
    const row=document.querySelector('.vrow[aria-current="true"]');
    if(row)row.scrollIntoView({block:'nearest'});
  }
});

renderList();renderDetail();

const ea=$('ethaddr');
ea.addEventListener('click',async()=>{
  const addr='0x7598557A58F1F0972EE7b66214D546a3328065bE';
  try{await navigator.clipboard.writeText(addr);}
  catch(e){const r=document.createRange();r.selectNodeContents(ea);const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');s.removeAllRanges();}
  ea.textContent='Copied!';setTimeout(()=>ea.textContent=addr,1200);
});

</script>
</body>
</html>
