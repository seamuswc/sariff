const IRREGULAR={
  "قال":{past:["\u0642\u0644\u062a", "\u0642\u0644\u062a", "\u0642\u0644\u062a\u064a", "\u0642\u0627\u0644", "\u0642\u0627\u0644\u062a", "\u0642\u0644\u0646\u0627", "\u0642\u0644\u062a\u0648", "\u0642\u0627\u0644\u0648\u0627"],pres:["\u0628\u0642\u0648\u0644", "\u0628\u062a\u0642\u0648\u0644", "\u0628\u062a\u0642\u0648\u0644\u064a", "\u0628\u064a\u0642\u0648\u0644", "\u0628\u062a\u0642\u0648\u0644", "\u0645\u0646\u0642\u0648\u0644", "\u0628\u062a\u0642\u0648\u0644\u0648\u0627", "\u0628\u064a\u0642\u0648\u0644\u0648\u0627"],kind:"irregular (root q-w-l)"},
  "إجا":{past:["\u062c\u064a\u062a", "\u062c\u064a\u062a", "\u062c\u064a\u062a\u064a", "\u0625\u062c\u0627", "\u0625\u062c\u062a", "\u062c\u064a\u0646\u0627", "\u062c\u064a\u062a\u0648", "\u0625\u062c\u0648"],pres:["\u0628\u0627\u062c\u064a", "\u0628\u062a\u0627\u062c\u064a", "\u0628\u062a\u0627\u062c\u064a", "\u0628\u064a\u0627\u062c\u064a", "\u0628\u062a\u0627\u062c\u064a", "\u0645\u0646\u0627\u062c\u064a", "\u0628\u062a\u0627\u062c\u0648\u0627", "\u0628\u064a\u0627\u062c\u0648\u0627"],kind:"irregular (root j-y-ʾ)"},
};

const T={'ب':'b','ت':'t','ث':'th','ج':'j','ح':'ḥ','خ':'kh','د':'d','ذ':'dh','ر':'r','ز':'z','س':'s','ش':'sh','ص':'ṣ','ض':'ḍ','ط':'ṭ','ظ':'ẓ','ع':'ʿ','غ':'gh','ف':'f','ق':'q','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','و':'w','ي':'y','ء':'ʾ','أ':'ʾ','آ':'ā','إ':'ʾ','ؤ':'ʾ','ى':'ā','َ':'a','ُ':'u','ِ':'i','ّ':''};
const PRONOUNS=["أنا ana — I","إنتا inta — you (m)","إنتي inti — you (f)","هوّي huwwe — he","هيّي hiyye — she","نحنا niḥna — we","إنتو intu — you (pl)","هنّه hénne — they"];
const cache=new Map();

function ar2tr(w){
  let s='';
  for(const c of w){s+=(T[c]||c);}
  return s;
}

function makeStems(entry){
  const [past3,pres3,type,gloss]=entry;
  
  if(type==='irr'){
    const irr=IRREGULAR[past3];
    if(!irr) return null;
    return {
      past: irr.past.map(a=>({ar:a,tr:ar2tr(a),segs:[[ar2tr(a),'c']]})),
      pres: irr.pres.map(a=>({ar:a,tr:ar2tr(a),segs:[]})),
      kind: irr.kind,
      gloss
    };
  }

  // Parse hollow: "راح|رح" -> 3ms=راح, short=رح
  let pastStem3=past3, pastStemShort=past3;
  if(type==='hollow'){
    const parts=past3.split('|');
    pastStem3=parts[0];
    pastStemShort=parts[1]||parts[0];
  }

  // Present stem: remove byi/bya prefix
  let presStem='';
  if(pres3.startsWith('byi')) presStem=pres3.slice(3);
  else if(pres3.startsWith('bya')) presStem=pres3.slice(3);
  else presStem=pres3;

  const past=[], pres=[];
  const pastTr3=ar2tr(pastStem3);
  const pastTrShort=ar2tr(pastStemShort);
  const presTr=ar2tr(presStem);

  if(type==='reg'||type==='doubled'){
    past.push({ar:pastStemShort+'ت',  tr:pastTrShort+'t',  segs:[[pastTrShort,'t'],['t','s']]});
    past.push({ar:pastStemShort+'ت',  tr:pastTrShort+'t',  segs:[[pastTrShort,'t'],['t','s']]});
    past.push({ar:pastStemShort+'تي', tr:pastTrShort+'ti', segs:[[pastTrShort,'t'],['ti','s']]});
    past.push({ar:pastStem3,          tr:pastTr3,          segs:[[pastTr3,'t']]});
    past.push({ar:pastStem3+'ت',      tr:pastTr3+'t',      segs:[[pastTr3,'t'],['t','s']]});
    past.push({ar:pastStemShort+'نا', tr:pastTrShort+'na', segs:[[pastTrShort,'t'],['na','s']]});
    past.push({ar:pastStemShort+'تو', tr:pastTrShort+'tu', segs:[[pastTrShort,'t'],['tu','s']]});
    past.push({ar:pastStem3+'و',      tr:pastTr3+'u',      segs:[[pastTr3,'t'],['u','s']]});
  } else if(type==='hollow'){
    past.push({ar:pastStemShort+'ت',  tr:pastTrShort+'t',  segs:[[pastTrShort,'c'],['t','s']]});
    past.push({ar:pastStemShort+'ت',  tr:pastTrShort+'t',  segs:[[pastTrShort,'c'],['t','s']]});
    past.push({ar:pastStemShort+'تي', tr:pastTrShort+'ti', segs:[[pastTrShort,'c'],['ti','s']]});
    past.push({ar:pastStem3,          tr:pastTr3,          segs:[[pastTr3,'t']]});
    past.push({ar:pastStem3+'ت',      tr:pastTr3+'t',      segs:[[pastTr3,'t'],['t','s']]});
    past.push({ar:pastStemShort+'نا', tr:pastTrShort+'na', segs:[[pastTrShort,'c'],['na','s']]});
    past.push({ar:pastStemShort+'تو', tr:pastTrShort+'tu', segs:[[pastTrShort,'c'],['tu','s']]});
    past.push({ar:pastStem3+'و',      tr:pastTr3+'u',      segs:[[pastTr3,'t'],['u','s']]});
  } else if(type==='def'){
    const base=pastStem3.replace(/ى$/,'').replace(/ا$/,'').replace(/ي$/,'');
    const baseTr=ar2tr(base);
    past.push({ar:base+'يت',   tr:baseTr+'īt',   segs:[[baseTr,'c'],['īt','s']]});
    past.push({ar:base+'يت',   tr:baseTr+'īt',   segs:[[baseTr,'c'],['īt','s']]});
    past.push({ar:base+'يتي',  tr:baseTr+'īti',  segs:[[baseTr,'c'],['īti','s']]});
    past.push({ar:pastStem3,    tr:pastTr3,       segs:[[pastTr3,'t']]});
    past.push({ar:base+'ت',     tr:baseTr+'t',    segs:[[baseTr,'c'],['t','s']]});
    past.push({ar:base+'ينا',  tr:baseTr+'īna',  segs:[[baseTr,'c'],['īna','s']]});
    past.push({ar:base+'يتو',  tr:baseTr+'ītu',  segs:[[baseTr,'c'],['ītu','s']]});
    past.push({ar:base+'وا',   tr:baseTr+'u',    segs:[[baseTr,'c'],['u','s']]});
  }

  // Present tense
  const pPref=['ب','بت','بت','بي','بت','من','بت','بي'];
  const pPrefTr=['b','bt','bt','by','bt','mn','bt','by'];
  const pSuf=['','','ي','','','','و','و'];
  const pSufTr=['','','i','','','','u','u'];

  for(let i=0;i<8;i++){
    const word=pPref[i]+presStem+(pSuf[i]||'');
    const segs=[[pPrefTr[i],'p'],[presTr,'t']];
    if(pSuf[i]) segs.push([pSufTr[i],'s']);
    pres.push({ar:word,tr:pPrefTr[i]+presTr+(pSufTr[i]||''),segs});
  }

  const kindMap={reg:'regular',hollow:'hollow',def:'defective',doubled:'doubled'};
  return {past,pres,kind:kindMap[type]||type,gloss};
}

function getConj(i){
  if(!cache.has(i)) cache.set(i,makeStems(VERBS[i]));
  return cache.get(i);
}

function fold(s){
  return s.toLowerCase().replace(/[āīūḥṭṣḍẓʿʾ]/g,c=>({ā:'a',ī:'i',ū:'u',ḥ:'h',ṭ:'t',ṣ:'s',ḍ:'d',ẓ:'z',ʿ:'',ʾ:''})[c]);
}

const INDEX=VERBS.map((v,i)=>{
  const c=getConj(i);
  if(!c) return null;
  return {i,ar:v[0]+' '+v[1],tr:fold(v[0]+' '+v[1]),gl:v[3].toLowerCase()};
}).filter(Boolean);

let cur=0, tense=0, visible=INDEX.map(x=>x.i);
const $=id=>document.getElementById(id);

function segHtml(segs){
  return segs.filter(s=>s[0]).map((s,k)=>(k?'<span class="sp">·</span>':'')+'<span class="seg-'+s[1]+'">'+s[0]+'</span>').join('');
}

function renderList(){
  const L=$('list'); L.innerHTML='';
  const frag=document.createDocumentFragment();
  for(const idx of visible){
    const c=getConj(idx);
    if(!c) continue;
    const b=document.createElement('button');
    b.className='vrow'; b.setAttribute('role','option');
    b.setAttribute('aria-current',idx===cur?'true':'false');
    b.innerHTML='<span class="ar">'+c.past[3].ar+'</span><span class="tr">'+c.past[3].tr+'</span><span class="gl">'+VERBS[idx][3]+'</span>';
    b.onclick=()=>{cur=idx;renderDetail();renderList();};
    frag.appendChild(b);
  }
  L.appendChild(frag);
  $('count').textContent=visible.length+' of '+VERBS.length+' verbs';
}

function renderDetail(){
  const v=VERBS[cur], c=getConj(cur);
  if(!c){$('bigar').textContent='';$('meta').textContent='';$('kind').textContent='Error';$('tbl').innerHTML='';return;}
  $('bigar').innerHTML=c.past[3].ar+'<span class="pres">'+c.pres[3].ar+'</span>';
  $('meta').innerHTML='<b>'+c.past[3].tr+'</b> / '+c.pres[3].tr+' — '+v[3];
  $('kind').textContent=c.kind;
  document.querySelectorAll('#tabs button').forEach((b,j)=>b.setAttribute('aria-pressed',j===tense?'true':'false'));
  let rows='<tr><th>Pronoun</th><th>Arabic</th><th>Transliteration</th><th>Built from</th></tr>';
  for(let r=0;r<8;r++){
    let ar,tr,segs;
    if(tense===0){ar=c.past[r].ar;tr=c.past[r].tr;segs=c.past[r].segs;}
    else if(tense===1){ar=c.pres[r].ar;tr=c.pres[r].tr;segs=c.pres[r].segs;}
    else{ar='رح '+c.pres[r].ar;tr='raḥ '+c.pres[r].tr;segs=[['raḥ','p']].concat(c.pres[r].segs);}
    rows+='<tr><td class="pn">'+PRONOUNS[r]+'</td><td class="aw ar">'+ar+'</td><td class="bf">'+tr+'</td><td class="bf">'+segHtml(segs)+'</td></tr>';
  }
  $('tbl').innerHTML=rows;
}

["Past","Present","Future = raḥ + present"].forEach((t,j)=>{
  const b=document.createElement('button'); b.textContent=t;
  b.onclick=()=>{tense=j;renderDetail();};
  $('tabs').appendChild(b);
});

const rnd=document.createElement('button');
rnd.textContent='🎲 Random verb';
rnd.style.marginInlineStart='auto';
rnd.onclick=()=>{
  const pool=visible.length?visible:INDEX.map(x=>x.i);
  let pick=pool[Math.floor(Math.random()*pool.length)];
  if(pool.length>1) while(pick===cur) pick=pool[Math.floor(Math.random()*pool.length)];
  cur=pick; renderDetail(); renderList();
  const row=document.querySelector('.vrow[aria-current="true"]'), list=$('list');
  if(row){
    const r=row.getBoundingClientRect(), l=list.getBoundingClientRect();
    if(r.top<l.top) list.scrollTop-=(l.top-r.top);
    else if(r.bottom>l.bottom) list.scrollTop+=(r.bottom-l.bottom);
  }
};
$('tabs').appendChild(rnd);

$('q').addEventListener('input',e=>{
  const q=e.target.value.trim(), qf=fold(q);
  visible = q ? INDEX.filter(x=>x.gl.includes(qf)||x.tr.includes(qf)||x.ar.includes(q)).map(x=>x.i) : INDEX.map(x=>x.i);
  renderList();
});

renderList(); renderDetail();

const ea=$('ethaddr');
ea.addEventListener('click',async()=>{
  const addr='0x7598557A58F1F0972EE7b66214D546a3328065bE';
  try{await navigator.clipboard.writeText(addr);}
  catch(e){
    const r=document.createRange(); r.selectNodeContents(ea);
    const s=getSelection(); s.removeAllRanges(); s.addRange(r);
    document.execCommand('copy'); s.removeAllRanges();
  }
  ea.textContent='copied ✓';
  setTimeout(()=>{ea.textContent=addr;},1500);
});
