{g:"talk, converse",i:{v:"разговаривать",p:["разговаривал","разговаривала","разговаривало","разговаривали"],n:["разговариваю","разговариваешь","разговаривает","разговариваем","разговариваете","разговаривают"],x:"Они разговаривают тихо. — They are talking quietly."}},

{g:"be nervous",i:{v:"нервничать",p:["нервничал","нервничала","нервничало","нервничали"],n:["нервничаю","нервничаешь","нервничает","нервничаем","нервничаете","нервничают"],x:"Не нервничай! — Don't be nervous!"}},

{g:"watch, monitor",i:{v:"следить",p:["следил","следила","следило","следили"],n:["слежу","следишь","следит","следим","следите","следят"],x:"Я слежу за новостями. — I follow the news."}},
];


const NEWMOTION=[
{g:"drag, haul",i:{v:"тащить",p:["тащил","тащила","тащило","тащили"],n:["тащу","тащишь","тащит","тащим","тащите","тащат"],x:"Он тащит чемодан. — He is dragging a suitcase."},h:{v:"таскать",p:["таскал","таскала","таскало","таскали"],n:["таскаю","таскаешь","таскает","таскаем","таскаете","таскают"],x:"Она таскает тяжёлые сумки. — She hauls heavy bags."},p:{v:"потащить",p:["потащил","потащила","потащило","потащили"],f:["потащу","потащишь","потащит","потащим","потащите","потащат"],x:"Я потащу коробку домой. — I will drag the box home."}},
{g:"roll, wheel",i:{v:"катить",p:["катил","катила","катило","катили"],n:["качу","катишь","катит","катим","катите","катят"],x:"Он катит тачку. — He is wheeling a barrow."},h:{v:"катать",p:["катал","катала","катало","катали"],n:["катаю","катаешь","катает","катаем","катаете","катают"],x:"Он катает дочку на санках. — He pulls his daughter on the sled."},p:{v:"покатить",p:["покатил","покатила","покатило","покатили"],f:["покачу","покатишь","покатит","покатим","покатите","покатят"],x:"Я покачу мяч к воротам. — I will roll the ball to the goal."}},
{g:"climb",i:{v:"лезть",p:["лез","лезла","лезло","лезли"],n:["лезу","лезешь","лезет","лезем","лезете","лезут"],x:"Кот лезет на дерево. — The cat is climbing the tree."},h:{v:"лазить",p:["лазил","лазила","лазило","лазили"],n:["лажу","лазишь","лазит","лазим","лазите","лазят"],x:"Дети лазят по деревьям. — The kids climb trees."},p:{v:"полезть",p:["полез","полезла","полезло","полезли"],f:["полезу","полезешь","полезет","полезем","полезете","полезут"],x:"Я полезу на крышу. — I will climb onto the roof."}},
{g:"trudge, wander",i:{v:"брести",p:["брёл","брела","брело","брели"],n:["бреду","бредёшь","бредёт","бредём","бредёте","бредут"],x:"Он бредёт по дороге. — He trudges along the road."},h:{v:"бродить",p:["бродил","бродила","бродило","бродили"],n:["брожу","бродишь","бродит","бродим","бродите","бродят"],x:"Она бродит по городу. — She wanders around the city."},p:{v:"побрести",p:["побрёл","побрела","побрело","побрели"],f:["побреду","побредёшь","побредёт","побредём","побредёте","побредут"],x:"Он побредёт домой. — He will trudge home."}},
];
const PAGES=PAIRS.concat(SINGLES,NEWPAIRS,NEWPAIRS2,NEWSINGLES,NEWPAIRS3,NEWPAIRS4,NEWSINGLES2,NEWMOTION);
const FUT_B=["буду","будешь","будет","будем","будете","будут"];
const PAST_L=["он (masc)","она (fem)","оно (neut)","они (plural)"];
const PRES_L=["я","ты","он/она/оно","мы","вы","они"];
function fold(s){return s.toLowerCase().replace(/ё/g,'е');}
const INDEX=PAGES.map((e,i)=>({i,gl:e.g.toLowerCase(),ri:e.i?fold(e.i.v):(e.p?fold(e.p.v):fold(e.v)),rp:e.p?fold(e.p.v):'',rh:e.h?fold(e.h.v):''}));
let cur=0,side=null,tense=1,visible=INDEX.map(x=>x.i);
const $=id=>document.getElementById(id);

function tenseVals(s){return s==='p'?[0,2]:[0,1,2];}
function getForms(e,s,t){
  const d=e[s];
  if(t===0)return d.p;
  if(s==='p')return d.f;
  return t===1?d.n:FUT_B.map(b=>b+' '+d.v);
}

function renderList(){
  const L=$('list');L.innerHTML='';
  const frag=document.createDocumentFragment();
  for(const idx of visible){
    const e=PAGES[idx];
    const b=document.createElement('button');
    b.className='vrow';b.setAttribute('role','option');
    b.setAttribute('aria-current',idx===cur?'true':'false');
    const ru=document.createElement('span');ru.className='ru';
    ru.textContent=e.i?e.i.v:e.p.v;
    if(e.i&&e.p){const s2=document.createElement('span');s2.className='perf';s2.textContent=' · '+e.p.v;ru.appendChild(s2);}
    const gl=document.createElement('span');gl.className='gl';gl.textContent=e.g;
    b.appendChild(ru);b.appendChild(gl);
    b.onclick=()=>{cur=idx;side=null;renderDetail();renderList();};
    frag.appendChild(b);
  }
  L.appendChild(frag);
  $('count').textContent=visible.length+' of '+PAGES.length+' verbs';
}

function mkRnd(){
  const rnd=document.createElement('button');
  rnd.textContent='🎲 Random verb';
  rnd.style.marginInlineStart='auto';
  rnd.onclick=()=>{
    const pool=visible.length?visible:INDEX.map(x=>x.i);
    let pick=pool[Math.floor(Math.random()*pool.length)];
    if(pool.length>1)while(pick===cur)pick=pool[Math.floor(Math.random()*pool.length)];
    cur=pick;side=null;renderDetail();renderList();
    const row=document.querySelector('.vrow[aria-current="true"]'),list=$('list');
    if(row){const r=row.getBoundingClientRect(),l=list.getBoundingClientRect();if(r.top<l.top)list.scrollTop-=(l.top-r.top);else if(r.bottom>l.bottom)list.scrollTop+=(r.bottom-l.bottom);}
  };
  return rnd;
}

function renderDetail(){
  const e=PAGES[cur];
  if(!side||!e[side])side=e.i?'i':'p';
  const d=e[side];
  const ASP_L={i:e.h?'imperfective · one-way':'imperfective · habitual',h:'imperfective · habitual',p:'perfective · one-time'};
  $('bigru').textContent=d.v;
  $('meta').innerHTML='<b>'+e.g+'</b> — '+ASP_L[side];
  const A=$('aspects');A.innerHTML='';
  for(const s of ['i','h','p']){
    if(!e[s])continue;
    const b=document.createElement('button');
    b.innerHTML=e[s].v+'<small>'+ASP_L[s]+'</small>';
    b.setAttribute('aria-pressed',s===side?'true':'false');
    b.onclick=()=>{side=s;if(s==='p'&&tense===1)tense=2;renderDetail();};
    A.appendChild(b);
  }
  const tvals=tenseVals(side),labels={0:'Past',1:'Present',2:'Future'};
  if(!tvals.includes(tense))tense=tvals[1];
  const T=$('tabs');T.innerHTML='';
  for(const t of tvals){
    const b=document.createElement('button');b.textContent=labels[t];
    b.setAttribute('aria-pressed',t===tense?'true':'false');
    b.onclick=()=>{tense=t;renderDetail();};
    T.appendChild(b);
  }
  T.appendChild(mkRnd());
  const f=getForms(e,side,tense);
  let rows;
  if(tense===0){
    rows='<tr><th>Gender/Number</th><th>Past</th></tr>';
    for(let r=0;r<4;r++)rows+='<tr><td class="pn">'+PAST_L[r]+'</td><td class="ruw">'+f[r]+'</td></tr>';
  }else{
    rows='<tr><th>Person</th><th>'+labels[tense]+'</th></tr>';
    for(let r=0;r<6;r++)rows+='<tr><td class="pn">'+PRES_L[r]+'</td><td class="ruw">'+f[r]+'</td></tr>';
  }
  $('tbl').innerHTML=rows;
  $('example').textContent=d.x||'';
}

$('q').addEventListener('input',e=>{
  const q=e.target.value.trim(),qf=fold(q);
  let re=null;
  if(q&&/[a-z]/.test(qf))re=new RegExp('\\b'+qf.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b');
  visible=q?INDEX.filter(x=>re?re.test(x.gl):(x.ri.includes(qf)||x.rp.includes(qf)||x.rh.includes(qf))).map(x=>x.i):INDEX.map(x=>x.i);
  if(visible.length===1){
    cur=visible[0];
    const e=PAGES[cur];
    side=null;
    if(qf){if(e.p&&fold(e.p.v)===qf)side='p';else if(e.h&&fold(e.h.v)===qf)side='h';}
    renderDetail();
  }
  renderList();
  if(visible.length===1){
    const row=document.querySelector('.vrow[aria-current="true"]');
    if(row)row.scrollIntoView({block:'nearest'});
  }
});

renderList();renderDetail();

const ea=$('ethaddr');
ea.addEventListener('click',async()=>{
  const addr='0x7598557A58F1F0972EE7b66214D546a3328065bE';
  try{await navigator.clipboard.writeText(addr);}
  catch(e){const r=document.createRange();r.selectNodeContents(ea);const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');s.removeAllRanges();}
  ea.textContent='Copied!';setTimeout(()=>ea.textContent=addr,1200);
});
