<script>
const T={'ب':'b','ت':'t','ث':'th','ج':'j','ح':'ḥ','خ':'kh','د':'d','ذ':'dh','ر':'r','ز':'z','س':'s','ش':'sh','ص':'ṣ','ض':'ḍ','ط':'ṭ','ظ':'ẓ','ع':'ʿ','غ':'gh','ف':'f','ق':'q','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','و':'w','ي':'y','ء':'ʾ','أ':'ʾ'};
const PSUF=[['تُ','tu'],['تَ','ta'],['تِ','ti'],['','a'],['ت','at'],['نا','nā'],['تم','tum'],['وا','ū']];
const PREA=[['أ','a'],['ت','ta'],['ت','ta'],['ي','ya'],['ت','ta'],['ن','na'],['ت','ta'],['ي','ya']];
const PREU=[['أ','u'],['ت','tu'],['ت','tu'],['ي','yu'],['ت','tu'],['ن','nu'],['ت','tu'],['ي','yu']];
const CSUF=[null,null,['ين','īna'],null,null,null,['ون','ūna'],['ون','ūna']];
const CONSROWS=[0,1,2,5,6];

function fixAr(w){return w.replace(/^أأ/,'آ');}
function fixTr(w){return w.replace(/^aʾ(?=[^aiuāīū])/,'ā').replace(/^uʾ(?=[^aiuāīū])/,'ū').replace(/^ʾ/,'');}

function makeStems(root,f,opt){
  opt=opt||'';
  const r=[...root], t=r.map(c=>T[c]||c);
  const hollow=(r[1]==='و'||r[1]==='ي'), defect=(r[2]==='و'||r[2]==='ي');
  const doubled=(r[1]===r[2]&&!defect), assim=(r[0]==='و');
  const A=opt.includes('A');
  const S={pv:'a',def:null,mark:{pC:false,pr:false,defPast:true}};

  if(f===1){
    if(defect){
      S.defPastBase=[r[0]+r[1], t[0]+'a'+t[1]];
      S.defGlide = r[2]==='ي'?'ي':'و';
      S.defI = A;
      S.def = A?'ā':(r[2]==='ي'?'ī':'ū');
      const pc = S.def==='ā'?'ى':(S.def==='ī'?'ي':'و');
      S.pr=[r[0]+r[1]+pc, t[0]+t[1]+(S.def==='ā'?'ā':S.def)];
      S.mark.pr=true;
    } else if(hollow){
      const long=r[1]==='و'?'ū':'ī';
      const presV = A?'ā':long;
      const shortV = presV==='ū'?'u':'i';
      const presAr = presV==='ā'?'ا':(presV==='ū'?'و':'ي');
      S.pA=[r[0]+'ا'+r[2], t[0]+'ā'+t[2]];
      S.pC=[r[0]+r[2], t[0]+shortV+t[2]]; S.mark.pC=true;
      S.pr=[r[0]+presAr+r[2], t[0]+presV+t[2]]; S.mark.pr=true;
    } else if(doubled){
      const pv = (opt==='a'||A)?'a':(opt||'u');
      const cv = pv==='a'?'i':'a';
      S.pA=[r[0]+r[1], t[0]+'a'+t[1]+t[1]];
      S.pC=[r[0]+r[1]+r[1], t[0]+'a'+t[1]+cv+t[1]]; S.mark.pC=true;
      S.pr=[r[0]+r[1], t[0]+pv+t[1]+t[1]]; S.mark.pr=true;
    } else {
      let pastV='a', presV=opt||'u';
      if(opt.length===2&&!A){pastV=opt[0];presV=opt[1];}
      S.pA=S.pC=[r[0]+r[1]+r[2], t[0]+'a'+t[1]+pastV+t[2]];
      if(assim){S.pr=[r[1]+r[2], t[1]+presV+t[2]]; S.mark.pr=true;}
      else S.pr=[r[0]+r[1]+r[2], t[0]+t[1]+presV+t[2]];
    }
  }
  else if(f===2){
    S.pv='u';
    if(defect){
      S.defPastBase=[r[0]+r[1], t[0]+'a'+t[1]+t[1]]; S.defGlide='ي'; S.def='ī';
      S.pr=[r[0]+r[1]+'ي', t[0]+'a'+t[1]+t[1]+'ī']; S.mark.pr=true;
    } else {
      S.pA=S.pC=[r[0]+r[1]+r[2], t[0]+'a'+t[1]+t[1]+'a'+t[2]];
      S.pr=[r[0]+r[1]+r[2], t[0]+'a'+t[1]+t[1]+'i'+t[2]];
    }
  }
  else if(f===3){
    S.pv='u';
    if(defect){
      S.defPastBase=[r[0]+'ا'+r[1], t[0]+'ā'+t[1]]; S.defGlide='ي'; S.def='ī';
      S.pr=[r[0]+'ا'+r[1]+'ي', t[0]+'ā'+t[1]+'ī']; S.mark.pr=true;
    } else {
      S.pA=S.pC=[r[0]+'ا'+r[1]+r[2], t[0]+'ā'+t[1]+'a'+t[2]];
      S.pr=[r[0]+'ا'+r[1]+r[2], t[0]+'ā'+t[1]+'i'+t[2]];
    }
  }
  else if(f===4){
    S.pv='u';
    if(defect){
      S.defPastBase=['أ'+r[0]+r[1], 'a'+t[0]+t[1]]; S.defGlide='ى'==='x'?'ى':'ي'; S.defGlide='ي'; S.def='ī';
      S.pr=[r[0]+r[1]+'ي', t[0]+t[1]+'ī']; S.mark.pr=true;
    } else if(hollow){
      S.pA=['أ'+r[0]+'ا'+r[2], 'a'+t[0]+'ā'+t[2]];
      S.pC=['أ'+r[0]+r[2], 'a'+t[0]+'a'+t[2]]; S.mark.pC=true;
      S.pr=[r[0]+'ي'+r[2], t[0]+'ī'+t[2]]; S.mark.pr=true;
    } else if(doubled){
      S.pA=['أ'+r[0]+r[1], 'a'+t[0]+'a'+t[1]+t[1]];
      S.pC=['أ'+r[0]+r[1]+r[1], 'a'+t[0]+t[1]+'a'+t[1]]; S.mark.pC=true;
      S.pr=[r[0]+r[1], t[0]+'i'+t[1]+t[1]]; S.mark.pr=true;
    } else {
      S.pA=S.pC=['أ'+r[0]+r[1]+r[2], 'a'+t[0]+t[1]+'a'+t[2]];
      S.pr=[r[0]+r[1]+r[2], t[0]+t[1]+'i'+t[2]];
    }
  }
  else if(f===5){
    if(defect){
      S.defPastBase=['ت'+r[0]+r[1], 'ta'+t[0]+'a'+t[1]+t[1]]; S.defGlide='ي'; S.def='ā';
      S.pr=['ت'+r[0]+r[1]+'ى', 'ta'+t[0]+'a'+t[1]+t[1]+'ā']; S.mark.pr=true;
    } else {
      S.pA=S.pC=['ت'+r[0]+r[1]+r[2], 'ta'+t[0]+'a'+t[1]+t[1]+'a'+t[2]];
      S.pr=S.pA;
    }
  }
  else if(f===6){
    S.pA=S.pC=['ت'+r[0]+'ا'+r[1]+r[2], 'ta'+t[0]+'ā'+t[1]+'a'+t[2]];
    S.pr=S.pA;
  }
  else if(f===7){
    S.pA=S.pC=['ان'+r[0]+r[1]+r[2], 'in'+t[0]+'a'+t[1]+'a'+t[2]];
    S.pr=['ن'+r[0]+r[1]+r[2], 'n'+t[0]+'a'+t[1]+'i'+t[2]];
  }
  else if(f===8){
    if(defect){
      S.defPastBase=['ا'+r[0]+'ت'+r[1], 'i'+t[0]+'ta'+t[1]]; S.defGlide='ي'; S.def='ī';
      S.pr=[r[0]+'ت'+r[1]+'ي', t[0]+'ta'+t[1]+'ī']; S.mark.pr=true;
    } else if(hollow){
      S.pA=['ا'+r[0]+'تا'+r[2], 'i'+t[0]+'tā'+t[2]];
      S.pC=['ا'+r[0]+'ت'+r[2], 'i'+t[0]+'ta'+t[2]]; S.mark.pC=true;
      S.pr=[r[0]+'تا'+r[2], t[0]+'tā'+t[2]]; S.mark.pr=true;
    } else if(doubled){
      S.pA=['ا'+r[0]+'ت'+r[1], 'i'+t[0]+'ta'+t[1]+t[1]];
      S.pC=['ا'+r[0]+'ت'+r[1]+r[1], 'i'+t[0]+'ta'+t[1]+'a'+t[1]]; S.mark.pC=true;
      S.pr=[r[0]+'ت'+r[1], t[0]+'ta'+t[1]+t[1]]; S.mark.pr=true;
    } else {
      S.pA=S.pC=['ا'+r[0]+'ت'+r[1]+r[2], 'i'+t[0]+'ta'+t[1]+'a'+t[2]];
      S.pr=[r[0]+'ت'+r[1]+r[2], t[0]+'ta'+t[1]+'i'+t[2]];
    }
  }
  else if(f===10){
    if(defect){
      S.defPastBase=['است'+r[0]+r[1], 'ista'+t[0]+t[1]]; S.defGlide='ي'; S.def='ī';
      S.pr=['ست'+r[0]+r[1]+'ي', 'sta'+t[0]+t[1]+'ī']; S.mark.pr=true;
    } else if(hollow){
      S.pA=['است'+r[0]+'ا'+r[2], 'ista'+t[0]+'ā'+t[2]];
      S.pC=['است'+r[0]+r[2], 'ista'+t[0]+'a'+t[2]]; S.mark.pC=true;
      S.pr=['ست'+r[0]+'ي'+r[2], 'sta'+t[0]+'ī'+t[2]]; S.mark.pr=true;
    } else if(doubled){
      S.pA=['است'+r[0]+r[1], 'ista'+t[0]+'a'+t[1]+t[1]];
      S.pC=['است'+r[0]+r[1]+r[1], 'ista'+t[0]+t[1]+'a'+t[1]]; S.mark.pC=true;
      S.pr=['ست'+r[0]+r[1], 'sta'+t[0]+'i'+t[1]+t[1]]; S.mark.pr=true;
    } else {
      S.pA=S.pC=['است'+r[0]+r[1]+r[2], 'ista'+t[0]+t[1]+'a'+t[2]];
      S.pr=['ست'+r[0]+r[1]+r[2], 'sta'+t[0]+t[1]+'i'+t[2]];
    }
  }
  S.kind = defect?'defective':hollow?'hollow':doubled?'doubled':assim?'assimilated (initial w)':(root.includes('أ')||root.includes('ء'))?'hamzated':'regular';
  return S;
}

function conjugate(root,f,opt){
  const S = makeStems(root,f,opt);
  const past=[], pres=[];
  if(S.def && S.defPastBase && S.defI){
    const [ba,bt]=S.defPastBase;
    for(let i=0;i<8;i++){
      if(i===3) past.push({ar:fixAr(ba+'ي'), segs:[[fixTr(bt+'iya'),'t']]});
      else if(i===4) past.push({ar:fixAr(ba+'يت'), segs:[[fixTr(bt+'iy'),'c'],['at','s']]});
      else if(i===7) past.push({ar:fixAr(ba+'وا'), segs:[[fixTr(bt),'c'],['ū','s']]});
      else {
        const [sa,st]=PSUF[i];
        past.push({ar:fixAr(ba+'ي'+sa), segs:[[fixTr(bt+'ī'),'c'],[st,'s']]});
      }
    }
  }
  else if(S.def && S.defPastBase){
    const [ba,bt]=S.defPastBase;
    const gAr=S.defGlide, gTr=(gAr==='ي')?'ay':'aw';
    for(let i=0;i<8;i++){
      if(i===3){
        const endAr = gAr==='ي'?'ى':'ا';
        past.push({ar:fixAr(ba+endAr), segs:[[fixTr(bt+'ā'),'t']]});
      } else if(i===4){
        past.push({ar:fixAr(ba+'ت'), segs:[[fixTr(bt),'c'],['at','s']]});
      } else if(i===7){
        past.push({ar:fixAr(ba+'وا'), segs:[[fixTr(bt),'c'],['aw','s']]});
      } else {
        const [sa,st]=PSUF[i];
        past.push({ar:fixAr(ba+gAr+sa), segs:[[fixTr(bt+gTr),'c'],[st,'s']]});
      }
    }
  } else {
    for(let i=0;i<8;i++){
      const cons=CONSROWS.includes(i);
      const [sta,stt]=cons?S.pC:S.pA;
      const cls=(cons&&S.mark.pC)?'c':'t';
      const [sa,st]=PSUF[i];
      const segs=[[fixTr(stt),cls]]; if(st)segs.push([st,'s']);
      past.push({ar:fixAr(sta+sa), segs});
    }
  }
  const PRE = S.pv==='u'?PREU:PREA;
  const [pa,pt]=S.pr;
  const prCls = S.mark.pr?'c':'t';
  for(let i=0;i<8;i++){
    const [fa,ft]=PRE[i];
    let stemAr=pa, stemTr=pt, sufAr='', sufTr='';
    if(S.pv==='u'&&stemAr[0]==='أ')stemAr='ؤ'+stemAr.slice(1);
    if(stemTr.endsWith('iʾ'))stemAr=stemAr.replace(/أ$/,'ئ');
    if(S.def){
      if(i===2){
        if(S.def==='ī'){sufAr='ن';sufTr='na';}
        else if(S.def==='ū'){stemAr=pa.replace(/و$/,'ي');stemTr=pt.replace(/ū$/,'ī');sufAr='ن';sufTr='na';}
        else {stemAr=pa.replace(/ى$/,'ي');stemTr=pt.replace(/ā$/,'ay');sufAr='ن';sufTr='na';}
      } else if(i===6||i===7){
        if(S.def==='ī'){stemAr=pa.replace(/ي$/,'و');stemTr=pt.replace(/ī$/,'ū');sufAr='ن';sufTr='na';}
        else if(S.def==='ū'){sufAr='ن';sufTr='na';}
        else {stemAr=pa.replace(/ى$/,'و');stemTr=pt.replace(/ā$/,'aw');sufAr='ن';sufTr='na';}
      }
    } else if(CSUF[i]){ [sufAr,sufTr]=CSUF[i]; }
    let word = fixAr(fa+stemAr+sufAr);
    let full = ft+stemTr;
    const segs=[];
    if((full.startsWith('aʾ')||full.startsWith('uʾ'))&&stemTr[1]&&!'aiuāīū'.includes(stemTr[1])){
      const merged = full[0]==='a'?'ā':'ū';
      segs.push([merged+stemTr.slice(1),'c']);

function conjCustomS(c){
  const past=[],pres=[];
  for(let i=0;i<8;i++){
    const [sa,st]=PSUF[i];
    const segs=[[c.s.pC[1], c.s.markC&&CONSROWS.includes(i)?'c':'t']]; if(st)segs.push([st,'s']);
    past.push({ar:fixAr(c.s.pA[0]+sa),segs});
  }
  const PRE=c.s.pv==='u'?PREU:PREA;
  for(let i=0;i<8;i++){
    const [fa,ft]=PRE[i];
    const segs=[[ft,'p'],[c.s.pr[1],c.s.markP?'c':'t']];
    let sufAr='';
    if(CSUF[i]){segs.push([CSUF[i][1],'s']);sufAr=CSUF[i][0];}
    pres.push({ar:fixAr(fa+c.s.pr[0]+sufAr),segs});
  }
  return {past,pres,kind:c.kind,cite:{pastAr:past[3].ar,pastTr:joinSegs(past[3].segs),presAr:pres[3].ar,presTr:joinSegs(pres[3].segs)}};
}

function getConj(entry){
  const [root,f,opt,gloss]=entry;
  if(CUSTOM[root]){
    const c=CUSTOM[root];
    if(c.s){const r=conjCustomS(c);r.gloss=gloss;return r;}
    return {past:c.past,pres:c.pres,kind:c.kind,gloss,
      cite:{pastAr:c.past[3].ar,pastTr:joinSegs(c.past[3].segs),presAr:c.pres[3].ar,presTr:joinSegs(c.pres[3].segs)}};
  }

}

const ROMAN={0:"irregular",1:"Form I",2:"Form II",3:"Form III",4:"Form IV",5:"Form V",6:"Form VI",7:"Form VII",8:"Form VIII",10:"Form X"};
const PRONOUNS=["أنا ana — I","أنتَ anta — you (m)","أنتِ anti — you (f)","هو huwa — he","هي hiya — she","نحن naḥnu — we","أنتم antum — you (pl)","هم hum — they"];
const cache=new Map();
function conjOf(i){if(!cache.has(i))cache.set(i,getConj(VERBS[i]));return cache.get(i);}
function fold(s){const m={'ā':'a','ī':'i','ū':'u','ḥ':'h','ṭ':'t','ṣ':'s','ḍ':'d','ẓ':'z','ʿ':'','ʾ':''};return s.toLowerCase().replace(/[āīūḥṭṣḍẓʿʾ]/g,c=>m[c]);}
const INDEX=VERBS.map((v,i)=>{const c=conjOf(i);return{i,ar:c.cite.pastAr+' '+c.cite.presAr+' '+v[0],tr:fold(c.cite.pastTr+' '+c.cite.presTr),gl:v[3].toLowerCase()};});
let cur=0, tense=0, visible=INDEX.map(x=>x.i);
const $=id=>document.getElementById(id);
function segHtml(segs){return segs.filter(s=>s[0]).map((s,k)=>(k?'<span class="sp">·</span>':'')+'<span class="seg-'+s[1]+'">'+s[0]+'</span>').join('');}
function renderList(){
  const L=$('list');L.innerHTML='';
  const frag=document.createDocumentFragment();
  for(const i of visible){
    const c=conjOf(i);
    const b=document.createElement('button');
    b.className='vrow';b.setAttribute('role','option');
    b.setAttribute('aria-current',i===cur?'true':'false');
    b.innerHTML='<span class="ar">'+c.cite.pastAr+'</span><span class="tr">'+c.cite.pastTr+'</span><span class="gl">'+VERBS[i][3]+'</span>';
    b.onclick=()=>{cur=i;renderDetail();renderList();};
    frag.appendChild(b);
  }
  L.appendChild(frag);
  $('count').textContent=visible.length+' of '+VERBS.length+' verbs';
}
function renderDetail(){
  const v=VERBS[cur], c=conjOf(cur);
  $('bigar').innerHTML=c.cite.pastAr+'<span class="pres">'+c.cite.presAr+'</span>';
  $('meta').innerHTML='<b>'+c.cite.pastTr+'</b> / '+c.cite.presTr+' — '+v[3];
  $('kind').textContent=ROMAN[v[1]]+' · '+c.kind;
  document.querySelectorAll('#tabs button').forEach((b,j)=>b.setAttribute('aria-pressed',j===tense?'true':'false'));
  let rows='<tr><th>Pronoun</th><th>Arabic</th><th>Built from</th></tr>';
  for(let r=0;r<8;r++){
    let ar,segs;
    if(tense===0){ar=c.past[r].ar;segs=c.past[r].segs;}
    else if(tense===1){ar=c.pres[r].ar;segs=c.pres[r].segs;}
    else{ar='س'+c.pres[r].ar;segs=[['sa','p']].concat(c.pres[r].segs);}
    rows+='<tr><td class="pn">'+PRONOUNS[r]+'</td><td class="aw ar">'+ar+'</td><td class="bf">'+segHtml(segs)+'</td></tr>';
  }
  $('tbl').innerHTML=rows;
}
["Past","Present","Future = sa- + present"].forEach((t,j)=>{
  const b=document.createElement('button');b.textContent=t;
  b.onclick=()=>{tense=j;renderDetail();};
  $('tabs').appendChild(b);
});
const rnd=document.createElement('button');
rnd.textContent='🎲 Random verb';
rnd.style.marginInlineStart='auto';
rnd.onclick=()=>{
  const pool=visible.length?visible:INDEX.map(x=>x.i);
  let pick=pool[Math.floor(Math.random()*pool.length)];
  if(pool.length>1)while(pick===cur)pick=pool[Math.floor(Math.random()*pool.length)];
  cur=pick;renderDetail();renderList();
  const row=document.querySelector('.vrow[aria-current="true"]'),list=$('list');
  if(row){
    const r=row.getBoundingClientRect(),l=list.getBoundingClientRect();
    if(r.top<l.top)list.scrollTop-=(l.top-r.top);
    else if(r.bottom>l.bottom)list.scrollTop+=(r.bottom-l.bottom);
  }
};
$('tabs').appendChild(rnd);
$('q').addEventListener('input',e=>{
  const q=e.target.value.trim(), qf=fold(q);
  visible = q ? INDEX.filter(x=>x.gl.includes(qf)||x.tr.includes(qf)||x.ar.includes(q)).map(x=>x.i) : INDEX.map(x=>x.i);
  renderList();
});
renderList();renderDetail();
const ea=$('ethaddr');
ea.addEventListener('click',async()=>{
  const addr='0x7598557A58F1F0972EE7b66214D546a3328065bE';
  try{await navigator.clipboard.writeText(addr);}
  catch(e){
    const r=document.createRange();r.selectNodeContents(ea);
    const s=getSelection();s.removeAllRanges();s.addRange(r);
    document.execCommand('copy');s.removeAllRanges();
  }
  ea.textContent='copied ✓';
  setTimeout(()=>{ea.textContent=addr;},1500);
});
</script>
